// =====================================================================
//  Project CARS 2 Dedicated Server - server.cfg
//  THIS FILE IS GENERATED AND OVERWRITTEN BY AMP ON EVERY START.
//  Do NOT edit it here - change the values in the AMP web panel
//  (Configuration tab). Ports are set on the Network tab.
//  Reference: https://web.heavenlysanctuary.com/UserGuide.pdf
// =====================================================================

logLevel : "{{logLevel}}"
eventsLogSize : {{eventsLogSize}}

name : "{{name}}"
password : "{{password}}"
maxPlayerCount : {{maxPlayerCount}}
secure : {{secure}}

// --- Network (port numbers come from AMP's Network/Ports tab) ---
bindIP : ""
steamPort : {{steamPort}}
hostPort : {{hostPort}}
queryPort : {{queryPort}}

sleepWaiting : 50
sleepActive : 10
sportsPlay : {{sportsPlay}}

// --- Lobby / game setup ---
allowEmptyJoin : {{allowEmptyJoin}}
controlGameSetup : {{controlGameSetup}}

// --- HTTP API (admin / web control) ---
enableHttpApi : {{enableHttpApi}}
httpApiInterface : ""
httpApiPort : {{httpApiPort}}
httpApiLogLevel : "warning"
httpApiExtraHeaders : {
    "*" : "Access-Control-Allow-Origin: *"
}
httpApiAccessLevels : { }
httpApiAccessFilters : {
    "public"  : [ { "type" : "accept" } ],
    "private" : [ { "type" : "group", "group" : "private" }, { "type" : "reject-password" } ],
    "admin"   : [ { "type" : "group", "group" : "admin" }, { "type" : "reject-password" } ]
}
httpApiUsers : { "admin" : "{{httpApiAdminPassword}}" }
httpApiGroups : { "private" : [ "admin" ], "admin" : [ "admin" ] }
staticWebFiles : "web_files"

// --- Lua scripting / addons ---
enableLuaApi : {{enableLuaApi}}
luaAddonRoot : "lua"
luaConfigRoot : "lua_config"
luaOutputRoot : "lua_output"
luaApiAddons : [ "sms_base", "sms_stats" ]
luaAllowedLibraries : [ "lib_rotate" ]

// --- Default session setup (used when controlGameSetup is true) ---
sessionAttributes : {
    "ServerControlsTrack" : {{serverControlsTrack}},
    "ServerControlsVehicleClass" : {{serverControlsVehicleClass}},
    "ServerControlsVehicle" : {{serverControlsVehicle}},
    "TrackId" : {{trackId}},
    "VehicleClassId" : {{vehicleClassId}},
    "VehicleModelId" : {{vehicleModelId}},
    "GridSize" : {{gridSize}},
    "MaxPlayers" : {{sessionMaxPlayers}},
    "PracticeLength" : {{practiceLength}},
    "QualifyLength" : {{qualifyLength}},
    "RaceLength" : {{raceLength}},
    "OpponentDifficulty" : {{opponentDifficulty}},
    "DamageType" : {{damageType}},
    "TireWearType" : {{tireWearType}},
    "FuelUsageType" : {{fuelUsageType}},
    "PenaltiesType" : {{penaltiesType}},
    "AllowedViews" : {{allowedViews}},
    "Flags" : {{flags}},
    "RaceDateYear" : {{raceDateYear}},
    "RaceDateMonth" : {{raceDateMonth}},
    "RaceDateDay" : {{raceDateDay}},
    "RaceDateHour" : {{raceDateHour}},
    "RaceWeatherSlots" : 1,
    "RaceWeatherSlot1" : {{weatherSlot1}},
    "RaceWeatherSlot2" : {{weatherSlot1}},
    "RaceWeatherSlot3" : {{weatherSlot1}},
    "RaceWeatherSlot4" : {{weatherSlot1}}
}

// --- Extra raw lines from the AMP "Additional server.cfg lines" box ---
{{userSettings}}
